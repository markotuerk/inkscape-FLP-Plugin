[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkscape-flp-plugin"
version = "0.1.0"
description = "Project scaffold for an Inkscape FLP Plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "inkex>=1.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
